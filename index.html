<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>"Remembering" "things"</title>
    <meta name="description" content="what exactly am i remembering here">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍐</text></svg>">
    <link href="style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <div id="time-tint"></div>
    <div id="intro">
      <button id="start-button">
        <span>start sticking</span>
      <span id="sound-info">🔈 note: plays sound!</span>
    </button>
    </div>
    <div id="marquee">
      <div id="marquee-text"><span class="marquee-copy"></span><span class="marquee-copy"></span></div>
    </div>
    <div id="sticker-play-area">
      <div id="produce-to-peel-from">
        <div id="current-produce-name"></div>
        <div id="current-sticker-container"><img src="" id="current-sticker-img" draggable="false"></div>
      </div>
      <main id="notebook"></main>
      <div id="thought" class="hidden">
        <div id="thought-text"></div>
        <div id="thought-options">
          <button id="thought-option-1" class="thought-option"></button>
          <button id="thought-option-2" class="thought-option"></button>
        </div>
      </div>
    </div>
    <div id="sound-toggle" aria-label="sound" aria-pressed="true">🔈</div>
    <footer><a target="_blank" href="https://www.instagram.com/anotherbrowsertab/">@anotherbrowsertab</a></footer>
  </body>
</html>
